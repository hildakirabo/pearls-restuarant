<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>boxes</title>
    <style>
        #box{
            width: 300px;
            border: 3px solid #000;
            padding: 10px;
            margin: 20px;
            box-sizing: border-box;
        }
        #content{
            width: 300px;
            border: 3px solid #000;
            padding: 10px;
            margin: 20px;
            box-sizing: content-box;
        }
        
    </style>
</head>
<body>
    <p id="box">This is a paragraph</p>
    <p id="content">This is another paragraph</p>

</body>
</html>
